description: Inertial Scroll Input Processor - Adds momentum-based scrolling

compatible: "zmk,input-processor-inertial-scroll"

include: ip_zero_param.yaml

properties:
  friction:
    type: int
    default: 15
    description: Base friction coefficient (1-100)

  min-velocity:
    type: int
    default: 50
    description: Minimum velocity to trigger inertia

  max-velocity:
    type: int
    default: 2000
    description: Maximum velocity cap

  max-duration-ms:
    type: int
    default: 1500
    description: Maximum inertia duration in ms

  velocity-scale:
    type: int
    default: 100
    description: Velocity scale factor (percentage)
